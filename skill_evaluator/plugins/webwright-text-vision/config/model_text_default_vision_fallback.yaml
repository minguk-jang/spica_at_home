# Backwards-compatible alias for the current Codex OAuth mode.
#
# Stack on top of base.yaml:
#   python -m webwright.run.cli -c base.yaml -c model_text_default_vision_fallback.yaml ...
#
# The agent uses the top-level `model` block through Codex CLI, so it inherits
# the user's Codex OAuth login. Screenshot-oriented tools such as image_qa and
# self_reflection use `vision_model` when present.

model:
  model_class: codex_cli
  model_name: gpt-5.3-codex-spark
  codex_sandbox: workspace-write
  request_timeout_seconds: 300
  attach_observation_screenshot: false

vision_model:
  model_class: codex_cli
  model_name: gpt-5.5
  codex_sandbox: workspace-write
  request_timeout_seconds: 300
  attach_observation_screenshot: true
