# Backwards-compatible alias for the fallback-only Codex OAuth harness mode.
#
# Stack on top of base.yaml:
#   python -m webwright.run.cli -c base.yaml -c model_text_default_vision_fallback.yaml ...
#
# Do not use this from inside an active Codex session unless explicitly testing
# the standalone harness. The preferred Codex path is direct plugin execution or
# WebMCP workflow materialization with `--synthesizer agent-json`.
# Screenshot-oriented fallback tools use `vision_model` when present.

model:
  model_class: codex_cli
  model_name: gpt-5.3-codex-spark
  codex_sandbox: workspace-write
  request_timeout_seconds: 300
  attach_observation_screenshot: false

vision_model:
  model_class: codex_cli
  model_name: gpt-5.5
  codex_sandbox: workspace-write
  request_timeout_seconds: 300
  attach_observation_screenshot: true
