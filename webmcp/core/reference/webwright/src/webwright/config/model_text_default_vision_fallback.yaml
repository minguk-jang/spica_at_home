# Backwards-compatible alias for the current Codex app-server OAuth mode.
#
# Stack on top of base.yaml:
#   python -m webwright.run.cli -c base.yaml -c model_text_default_vision_fallback.yaml ...
#
# The agent uses the top-level `model` block through Codex app-server, so it
# inherits the user's Codex OAuth login without nested subprocesses.
# Screenshot-oriented tools such as image_qa and self_reflection use
# `vision_model` when present.

model:
  model_class: codex_app_server
  model_name: gpt-5.5
  codex_sandbox: read-only
  request_timeout_seconds: 300
  attach_observation_screenshot: false

vision_model:
  model_class: codex_app_server
  model_name: gpt-5.5
  codex_sandbox: read-only
  request_timeout_seconds: 300
  attach_observation_screenshot: true
